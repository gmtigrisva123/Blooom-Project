# Dependabot keeps dependencies fresh once a month and opens a PR for each
# update. CI (see workflows/ci.yml) builds every PR, so an update only reaches
# main if the app still compiles and lints cleanly.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    groups:
      # One PR for all routine updates keeps the review load small; majors stay
      # separate because they are the ones that actually break things.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '02:00'
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(ci)'
