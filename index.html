<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Đồng hồ tập trung và thẻ nhớ tự nhắc ôn cho học sinh, sinh viên. Miễn phí, dùng thử không cần tài khoản."
    />
    <meta name="author" content="Viet Anh Ho" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://blooom-project.vercel.app/" />

    <!-- Icons. %BASE_URL% keeps them resolving on every route and every host. -->
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%BASE_URL%icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#f8f5ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121008" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Blooom" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (Facebook, Zalo, Messenger, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blooom" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Blooom: học tập trung hơn, nhớ lâu hơn" />
    <meta
      property="og:description"
      content="Đồng hồ tập trung và thẻ nhớ tự nhắc ôn cho học sinh, sinh viên."
    />
    <meta property="og:url" content="https://blooom-project.vercel.app/" />
    <meta property="og:image" content="https://blooom-project.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Blooom: học tập trung hơn, nhớ lâu hơn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blooom: học tập trung hơn, nhớ lâu hơn" />
    <meta
      name="twitter:description"
      content="Đồng hồ tập trung và thẻ nhớ tự nhắc ôn cho học sinh, sinh viên."
    />
    <meta name="twitter:image" content="https://blooom-project.vercel.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Blooom",
        "url": "https://blooom-project.vercel.app/",
        "description": "Đồng hồ tập trung và thẻ nhớ tự nhắc ôn cho học sinh, sinh viên.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "vi-VN",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "VND" },
        "author": { "@type": "Person", "name": "Viet Anh Ho" },
        "featureList": [
          "Đồng hồ tập trung",
          "Thẻ nhớ tự nhắc ôn đúng lúc",
          "Nhóm học theo môn",
          "Lưu ảnh chụp vở và tệp PDF",
          "Mục tiêu tuần, chuỗi ngày học và huy hiệu",
          "So sánh hai cách học"
        ]
      }
    </script>

    <!--
      Pick the theme before first paint: the saved choice if there is one,
      otherwise whatever the device prefers. src/lib/theme.js makes the same
      decision, so the splash and the app never disagree.
    -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('blooom_theme');
        } catch (e) {
          /* Private mode can throw; fall through to the device preference. */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-mode', theme);
      })();
    </script>

    <!--
      Splash shown until React has something to draw. Plain HTML and CSS, so
      it appears before the app bundle arrives, and it removes itself through
      `#root:not(:empty)` — no script needed.
    -->
    <style>
      html {
        background: #f8f5ea;
      }
      html[data-mode='dark'] {
        background: #121008;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f8f5ea;
        transition:
          opacity 0.3s ease,
          visibility 0.3s;
      }
      [data-mode='dark'] #app-splash {
        background: #121008;
      }
      #root:not(:empty) + #app-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: min(52vw, 220px);
        height: auto;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.55;
          transform: scale(0.98);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" role="status" aria-label="Đang mở Blooom">
      <img src="%BASE_URL%blooom-logo.png" alt="" width="459" height="152" />
    </div>
    <noscript
      >Blooom cần JavaScript để chạy. Bạn hãy bật JavaScript trong trình duyệt nhé.</noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
