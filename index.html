    <!--
      AppContext only sets data-theme once React mounts, which would flash the
      dark shell at anyone who picked the light theme. Replaying the stored
      choice here — same key, before first paint — keeps the splash and the app
      on the same background.
    -->
    <script>
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('studyhub_theme') || 'dark'
        );
      } catch (e) {
        /* Private mode can throw on localStorage; the dark default is fine. */
      }
    </script>

    <!--
      Splash shown between first paint and React mounting. It is plain CSS/HTML
      so it renders before the app bundle arrives, and it fades itself out via
      `#root:not(:empty)` — createRoot appends to the container rather than
      emptying it, so no script is needed to tear the splash down.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #0a0a14;
        transition:
          opacity 0.35s ease,
          visibility 0.35s;
      }
      [data-theme='light'] #app-splash {
        background: #f4f4f9;
      }
      #root:not(:empty) + #app-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: min(58vw, 260px);
        animation: splash-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash div {
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.18);
      }
      #app-splash div::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8b5cf6, #ec4899 55%, #f97316);
        animation: splash-sweep 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.97);
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(322%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img,
        #app-splash div::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash">

      <div role="progressbar" aria-label="Đang tải Blooom"></div>
    </div>
